name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and attach the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      # Built from the tag rather than downloaded from a CI run: the package is
      # a zip of Lua source with nothing compiled in it, so building it again
      # costs seconds and removes a whole class of "which artifact was that"
      # questions.
      - name: Test
        run: make test

      - name: Package
        run: make package

      - name: Check the package is what it claims to be
        run: |
          set -euo pipefail
          version="$(make version)"
          archive="build/notebook.koplugin-${version}.zip"
          test -f "$archive"
          unzip -tq "$archive"

          # A tagged release must carry the version the tag names, or the
          # download and the tag disagree and nobody can tell which is right.
          if [[ "${{ github.event_name }}" == release ]]; then
            tag="${{ github.event.release.tag_name }}"
            if [[ "$tag" != "$version" ]]; then
              echo "tag $tag does not match lua/_meta.lua version $version" >&2
              exit 1
            fi
          fi

          # The tests must not be in it, and main.lua must be.
          unzip -l "$archive" | grep -q 'notebook.koplugin/main.lua'
          if unzip -l "$archive" | grep -q 'notebook.koplugin/spec/'; then
            echo "the package carries the test bench" >&2
            exit 1
          fi

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          fail_on_unmatched_files: true

      - name: Upload from a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: koplugin-package
          path: build/*.zip
          if-no-files-found: error
