name: Release
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notebook-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua5.1 luarocks
          sudo luarocks install luacheck
      - run: npm ci --ignore-scripts
      - run: make verify
      - name: Version, build and publish
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bring stable history back to dev when it can fast-forward
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git fetch origin main dev
          if git merge-base --is-ancestor origin/dev origin/main; then
            git push origin origin/main:refs/heads/dev
          else
            echo 'dev has additional work; merge main before the next stable promotion.'
          fi
