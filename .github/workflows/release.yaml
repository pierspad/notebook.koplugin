name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and attach the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LuaJIT and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua5.1 luarocks
          sudo luarocks install luacheck

      # Built from the tag rather than downloaded from a CI run: the package is
      # a zip of Lua source with nothing compiled in it, so building it again
      # costs seconds and removes a whole class of "which artifact was that"
      # questions. `make ci` is the same target CI and the pre-push hook use,
      # and it is where the checks on the package itself live.
      - name: make ci
        run: make ci

      - name: The tag and the version must agree
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(make version)"
          if [[ "$TAG" != "$version" ]]; then
            echo "tag $TAG does not match lua/_meta.lua version $version" >&2
            exit 1
          fi

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          fail_on_unmatched_files: true

      - name: Upload from a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: koplugin-package
          path: build/*.zip
          if-no-files-found: error
